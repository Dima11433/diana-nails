  <style>
    html { scroll-behavior: smooth; }
    body {
      background: #f2689a;
      color: #fff;
      overflow-x: hidden;
    }
    /* Розовый фон с мягкими живыми пятнами */
    .pink-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(60% 50% at 15% 10%, #ffb6d0 0%, transparent 60%),
        radial-gradient(50% 50% at 85% 25%, #ff86b3 0%, transparent 60%),
        radial-gradient(70% 60% at 50% 100%, #d93b78 0%, transparent 65%),
        linear-gradient(160deg, #ff9cc1 0%, #f2689a 45%, #e04c86 100%);
    }
    .blob {
      position: absolute; border-radius: 9999px; filter: blur(80px); opacity: .55;
      animation: float 18s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translate(0,0) scale(1); }
      33% { transform: translate(60px,-40px) scale(1.1); }
      66% { transform: translate(-40px,50px) scale(.95); }
    }
    #bottles {
      position: fixed; inset: 0; width: 100vw; height: 100vh;
      z-index: 1; pointer-events: none;
    }
    #root { position: relative; z-index: 10; }

    /* ---------- Liquid glass ---------- */
    .liquid-glass {
      background: rgba(255,255,255,0.08);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%,
        rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0) 40%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.15) 80%,
        rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .liquid-glass-strong {
      background: rgba(255,255,255,0.12);
      background-blend-mode: luminosity;
      backdrop-filter: blur(50px);
      -webkit-backdrop-filter: blur(50px);
      border: none;
      box-shadow: 4px 4px 4px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,0.15);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass-strong::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.5) 0%,
        rgba(255,255,255,0.2) 20%,
        rgba(255,255,255,0) 40%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.2) 80%,
        rgba(255,255,255,0.5) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .text-shadow-soft { text-shadow: 0 2px 30px rgba(150, 20, 70, .25); }

  <!-- ================= 3D: флакончики лака (Three.js) ================= -->
  <script type="importmap">
    { "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    } }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const canvas = document.getElementById('bottles');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 0, 14);

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(4, 6, 8); scene.add(key);
    const rim = new THREE.DirectionalLight(0xff9cc8, 2.5); rim.position.set(-6, -2, -4); scene.add(rim);

    // ---- Материалы ----
    const glassMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff, metalness: 0, roughness: 0.04,
      transparent: true, opacity: 0.28, clearcoat: 1, clearcoatRoughness: 0.02,
      envMapIntensity: 2.2, depthWrite: false, side: THREE.FrontSide,
    });
    const goldMat = new THREE.MeshPhysicalMaterial({ color: 0xf3c98b, metalness: 1, roughness: 0.22, clearcoat: 1 });
    const blackMat = new THREE.MeshPhysicalMaterial({ color: 0x141014, metalness: 0.2, roughness: 0.18, clearcoat: 1, clearcoatRoughness: 0.05 });
    const whiteCapMat = new THREE.MeshPhysicalMaterial({ color: 0xfff3f7, metalness: 0, roughness: 0.25, clearcoat: 1 });

    function polishMat(hex, shimmer = false) {
      return new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(hex), metalness: shimmer ? 0.55 : 0.05, roughness: shimmer ? 0.28 : 0.12,
        clearcoat: 1, clearcoatRoughness: 0.03, sheen: 1, sheenColor: new THREE.Color(0xffffff), envMapIntensity: 1.4,
      });
    }

    // ---- Флакон: квадратный / круглый / высокий ----
    function makeBottle({ color, type = 'square', cap = 'black', shimmer = false }) {
      const g = new THREE.Group();
      let bodyH;
      if (type === 'round') {
        bodyH = 1.5;
        const liquid = new THREE.Mesh(new THREE.SphereGeometry(0.72, 48, 32), polishMat(color, shimmer));
        liquid.scale.set(1, 0.95, 1); liquid.position.y = -0.04;
        const glass = new THREE.Mesh(new THREE.SphereGeometry(0.82, 48, 32), glassMat);
        glass.renderOrder = 2;
        g.add(liquid, glass);
      } else {
        const w = type === 'tall' ? 1.0 : 1.35, h = type === 'tall' ? 1.9 : 1.5, d = type === 'tall' ? 1.0 : 0.95;
        bodyH = h;
        const liquid = new THREE.Mesh(new RoundedBoxGeometry(w - 0.22, h - 0.3, d - 0.22, 6, 0.2), polishMat(color, shimmer));
        liquid.position.y = -0.08;
        const glass = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 8, 0.28), glassMat);
        glass.renderOrder = 2;
        g.add(liquid, glass);
      }
      const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.32, 0.22, 32), glassMat);
      neck.position.y = bodyH / 2 + 0.08; neck.renderOrder = 2;
      const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.1, 48), goldMat);
      ring.position.y = bodyH / 2 + 0.22;
      const capH = type === 'tall' ? 1.5 : 1.7;
      const capMat = cap === 'gold' ? goldMat : cap === 'white' ? whiteCapMat : blackMat;
      const capMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.36, capH, 48), capMat);
      capMesh.position.y = bodyH / 2 + 0.27 + capH / 2;
      const capTop = new THREE.Mesh(new THREE.SphereGeometry(0.3, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), capMat);
      capTop.scale.y = 0.25; capTop.position.y = bodyH / 2 + 0.27 + capH;
      g.add(neck, ring, capMesh, capTop);

      // Центрируем
      const box = new THREE.Box3().setFromObject(g);
      const c = box.getCenter(new THREE.Vector3());
      g.children.forEach(m => m.position.sub(c));
      const wrap = new THREE.Group(); wrap.add(g);
      return wrap;
    }

    // side: -1 слева, 1 справа; y: доля от половины высоты экрана
    const defs = [
      { side: -1, y: 0.55, z: 0.5, color: '#ff1f66', type: 'square', cap: 'black' },
      { side: -1, y: -0.05, z: -1.5, color: '#f7c6d4', type: 'round', cap: 'gold' },
      { side: -1, y: -0.65, z: 1.0, color: '#7d1035', type: 'tall', cap: 'gold' },
      { side: 1, y: 0.6, z: -1.0, color: '#fff0f4', type: 'tall', cap: 'white', shimmer: true },
      { side: 1, y: 0.0, z: 1.0, color: '#d61d5f', type: 'square', cap: 'gold', shimmer: true },
      { side: 1, y: -0.62, z: -0.5, color: '#e9a990', type: 'round', cap: 'black' },
    ];
    const bottles = defs.map((d, i) => {
      const b = makeBottle(d);
      b.userData = { ...d, phase: i * 1.37, spin: (i % 2 ? -1 : 1) * (0.25 + (i % 3) * 0.08) };
      b.rotation.z = d.side * 0.25;
      scene.add(b);
      return b;
    });

    // Блёстки / кристаллы
    const gems = [];
    const gemGeo = new THREE.OctahedronGeometry(0.12, 0);
    const gemMats = [
      new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 1, roughness: 0.05, envMapIntensity: 3 }),
      new THREE.MeshPhysicalMaterial({ color: 0xffb3cf, metalness: 1, roughness: 0.1, envMapIntensity: 3 }),
      goldMat,
    ];
    for (let i = 0; i < 26; i++) {
      const m = new THREE.Mesh(gemGeo, gemMats[i % 3]);
      m.userData = {
        side: i % 2 ? 1 : -1, y: Math.random() * 2 - 1, z: Math.random() * 4 - 3,
        off: Math.random() * 2.2, phase: Math.random() * 10, s: 0.5 + Math.random() * 1.1,
      };
      m.scale.setScalar(m.userData.s);
      scene.add(m); gems.push(m);
    }

    // ---- Взаимодействие ----
    const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
    addEventListener('pointermove', e => {
      mouse.tx = (e.clientX / innerWidth) * 2 - 1;
      mouse.ty = (e.clientY / innerHeight) * 2 - 1;
    });
    let lastScroll = scrollY, scrollVel = 0;

    function resize() {
      renderer.setSize(innerWidth, innerHeight, false);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize); resize();

    const clock = new THREE.Clock();
    function tick() {
      const t = clock.getElapsedTime();
      mouse.x += (mouse.tx - mouse.x) * 0.05;
      mouse.y += (mouse.ty - mouse.y) * 0.05;
      const sv = scrollY - lastScroll; lastScroll = scrollY;
      scrollVel += (sv - scrollVel) * 0.1;

      const halfH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z;
      const halfW = halfH * camera.aspect;
      const mobile = camera.aspect < 0.85;
      const scale = mobile ? 0.5 : Math.min(1, 0.65 + camera.aspect * 0.2);
      const edge = mobile ? 0.7 : 1.7;

      bottles.forEach(b => {
        const u = b.userData;
        b.scale.setScalar(scale);
        b.position.x = u.side * (halfW - edge) + Math.sin(t * 0.6 + u.phase) * 0.15 + mouse.x * 0.35;
        b.position.y = u.y * halfH * 0.85 + Math.sin(t * 0.9 + u.phase) * 0.28 - mouse.y * 0.25 + scrollVel * 0.01 * u.side;
        b.position.z = u.z;
        b.rotation.y += 0.006 * u.spin * 2 + scrollVel * 0.004;
        b.rotation.x = Math.sin(t * 0.7 + u.phase) * 0.18 + mouse.y * 0.25;
        b.rotation.z = u.side * 0.22 + Math.cos(t * 0.5 + u.phase) * 0.08 - mouse.x * 0.15;
      });
      gems.forEach(g => {
        const u = g.userData;
        g.position.x = u.side * (halfW - edge * 0.6 - u.off) + mouse.x * 0.6;
        g.position.y = ((u.y * halfH + t * 0.25 * u.s + 100 * halfH) % (2 * halfH)) - halfH;
        g.position.z = u.z;
        g.rotation.x = t * u.s; g.rotation.y = t * 1.3 * u.s;
      });

      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    tick();
  </script>

  <!-- ================= React App ================= -->
  <script type="text/babel" data-presets="react">
    // Отключаем безвредные dev-предупреждения о key в списках
    const _err = console.error;
    console.error = (...a) => { if (typeof a[0] === 'string' && a[0].includes('unique "key"')) return; _err(...a); };

    const { useEffect, useRef, useState } = React;
    const { motion, useMotionValue, useSpring, useTransform } = window.Motion;

    /* ---------------- Иконки ---------------- */
    const ArrowUpRight = ({ className = "h-5 w-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M7 17L17 7" /><path d="M7 7h10v10" />
      </svg>
    );
    const Play = ({ className = "h-4 w-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4" /></svg>
    );
    const HeartIcon = () => (
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z" />
      </svg>
    );
    const ClockIcon = () => (
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" />
      </svg>
    );
    const StarIcon = ({ className = "h-3.5 w-3.5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z" /></svg>
    );
    // Иконки услуг (fill currentColor)
    const PolishIcon = () => (
      <svg className="h-6 w-6 text-white" viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 2h4v6h-4zM9 9h6v2H9zM7 12a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-8Z" />
      </svg>
    );
    const NailIcon = () => (
      <svg className="h-6 w-6 text-white" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2c3.3 0 6 2.7 6 6v8a6 6 0 0 1-12 0V8c0-3.3 2.7-6 6-6Zm0 2a4 4 0 0 0-4 4v1h8V8a4 4 0 0 0-4-4Z" />
      </svg>
    );
    const SparkleIcon = () => (
      <svg className="h-6 w-6 text-white" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9L12 2Zm7 12 .9 2.6 2.6.9-2.6.9L19 21l-.9-2.6-2.6-.9 2.6-.9.9-2.6ZM5 15l.7 1.8 1.8.7-1.8.7L5 20l-.7-1.8-1.8-.7 1.8-.7L5 15Z" />
      </svg>
    );

    /* ---------------- BlurText ---------------- */
    function BlurText({ text, className = "", delay = 100, justify = "center" }) {
      const ref = useRef(null);
      const [inView, setInView] = useState(false);
      useEffect(() => {
        const obs = new IntersectionObserver(([e]) => {
          if (e.isIntersecting) { setInView(true); obs.disconnect(); }
        }, { threshold: 0.1 });
        if (ref.current) obs.observe(ref.current);
        return () => obs.disconnect();
      }, []);
      const words = text.split(" ");
      return (
        <p ref={ref} className={className}
           style={{ display: "flex", flexWrap: "wrap", justifyContent: justify, rowGap: "0.1em" }}>
          {words.map((w, i) => (
            <motion.span key={i}
              initial={{ filter: "blur(10px)", opacity: 0, y: 50 }}
              animate={inView ? {
                filter: ["blur(10px)", "blur(5px)", "blur(0px)"],
                opacity: [0, 0.5, 1],
                y: [50, -5, 0],
              } : {}}
              transition={{ duration: 0.7, times: [0, 0.5, 1], ease: "easeOut", delay: (i * delay) / 1000 }}
              style={{ display: "inline-block", marginRight: "0.28em" }}>
              {w}
            </motion.span>
          ))}
        </p>
      );
    }

    const fadeUp = (delay) => ({
      initial: { filter: "blur(10px)", opacity: 0, y: 20 },
      animate: { filter: "blur(0px)", opacity: 1, y: 0 },
      transition: { duration: 0.8, delay, ease: "easeOut" },
    });
    const inViewUp = (delay = 0) => ({
      initial: { filter: "blur(10px)", opacity: 0, y: 30 },
      whileInView: { filter: "blur(0px)", opacity: 1, y: 0 },
      viewport: { once: true, amount: 0.2 },
      transition: { duration: 0.8, delay, ease: "easeOut" },
    });

    /* ---------------- 3D tilt-обёртка ---------------- */
    function Tilt({ children, className = "", max = 12 }) {
      const x = useMotionValue(0.5), y = useMotionValue(0.5);
      const rx = useSpring(useTransform(y, [0, 1], [max, -max]), { stiffness: 150, damping: 15 });
      const ry = useSpring(useTransform(x, [0, 1], [-max, max]), { stiffness: 150, damping: 15 });
      const onMove = (e) => {
        const r = e.currentTarget.getBoundingClientRect();
        x.set((e.clientX - r.left) / r.width);
        y.set((e.clientY - r.top) / r.height);
      };
      const reset = () => { x.set(0.5); y.set(0.5); };
      return (
        <div style={{ perspective: 1000 }} className={className}>
          <motion.div onPointerMove={onMove} onPointerLeave={reset}
            style={{ rotateX: rx, rotateY: ry, transformStyle: "preserve-3d" }} className="h-full">
            {children}
          </motion.div>
        </div>
      );
    }

    /* ---------------- Navbar ---------------- */
    const LINKS = [
      ["Главная", "#home"], ["Работы", "#works"], ["Услуги", "#services"], ["Обо мне", "#about"], ["Контакты", "#contact"],
    ];
    function Navbar() {
      return (
        <nav className="fixed top-4 left-0 right-0 z-50 px-8 lg:px-16 flex items-center justify-between">
          <a href="#home" className="liquid-glass rounded-full w-12 h-12 flex items-center justify-center">
            <span className="font-heading italic text-white text-3xl leading-none -mt-1">д</span>
          </a>
          <div className="hidden md:flex items-center liquid-glass rounded-full px-1.5 py-1.5">
            {LINKS.map(([l, h]) => (
              <a key={l} href={h} className="px-3 py-2 text-sm font-medium text-white/90 font-body hover:text-white">{l}</a>
            ))}
            <a href="#contact" className="ml-1 flex items-center gap-1 bg-white text-[#d6336c] rounded-full px-4 py-2 text-sm font-semibold font-body whitespace-nowrap">
              Записаться <ArrowUpRight className="h-4 w-4" />
            </a>
          </div>
          <a href="#contact" className="md:hidden flex items-center gap-1 bg-white text-[#d6336c] rounded-full px-4 py-2.5 text-sm font-semibold font-body">
            Записаться <ArrowUpRight className="h-4 w-4" />
          </a>
          <div className="hidden md:block w-12 h-12" />
        </nav>
      );
    }

    /* ---------------- Фото Дианы ---------------- */
    function PhotoCard() {
      return (
        <motion.div {...fadeUp(0.6)} className="relative mx-auto w-full max-w-[400px]">
          <Tilt max={10}>
            <div className="liquid-glass rounded-[2.25rem] p-3">
              <div className="relative rounded-[1.75rem] overflow-hidden aspect-[3/4]">
                <img src="assets/diana.jpg" alt="Диана Морозова"
                     className="absolute inset-0 w-full h-full object-cover" style={{ objectPosition: "50% 72%" }} />
                <div className="absolute inset-x-0 bottom-0 h-1/3 bg-gradient-to-t from-[#b0255c]/50 to-transparent" />
                <div className="absolute left-4 right-4 bottom-4 liquid-glass-strong rounded-[1.25rem] px-4 py-3 flex items-center justify-between">
                  <div>
                    <div className="font-heading italic text-2xl leading-none">Диана Морозова</div>
                    <div className="text-xs font-body font-light text-white/90 mt-1">nail-мастер · дизайн ногтей</div>
                  </div>
                  <div className="flex text-white"><StarIcon /><StarIcon /><StarIcon /><StarIcon /><StarIcon /></div>
                </div>
